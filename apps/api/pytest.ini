[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test

# Test discovery
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Default options
addopts =
    --strict-markers
    --tb=short
    -v

# Custom markers
markers =
    slow: Slow tests (integration, E2E)
    unit: Pure unit tests (no DB)